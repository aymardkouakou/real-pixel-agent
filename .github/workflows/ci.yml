name: CI

# Tests + paquet .vsix à chaque push et pull request.
# Release automatique : sur main (ou via « Run workflow »), si la version du package.json
# n'a pas encore de release GitHub, le job « release » crée le tag vX.Y.Z et publie la
# release avec les notes du CHANGELOG et le .vsix. Pousser un tag vX.Y.Z fonctionne aussi.
# CI TEMPORAIREMENT DÉSACTIVÉE : déclenchement manuel uniquement (onglet Actions → « Run workflow »).
# Pour la réactiver, remplacer le bloc « on: » par :
#   on:
#     push:
#       branches: [main]
#       tags: ['v*']
#     pull_request:
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: write   # création du tag et de la release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run compile

      - name: Tests unitaires et test de fumée
        run: npm test

      - name: Navigateur pour les tests de rendu
        run: npx playwright install --with-deps chromium

      # Non bloquant au départ : le rendu du texte peut différer légèrement entre machines.
      # Une fois les références régénérées sur la CI (UPDATE_SNAPSHOTS=1), retirer continue-on-error.
      - name: Tests de rendu (captures de référence)
        run: npm run test:render
        continue-on-error: true

      - name: Captures en échec
        if: always() && hashFiles('test-results/*.png') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Paquet .vsix
        run: npx vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Version à publier
        id: v
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME}" != "${VERSION}" ]]; then
            echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version du package.json (${VERSION})"
            exit 1
          fi
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} déjà publiée : rien à faire."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.v.outputs.publish == 'true'
        with:
          name: vsix

      - name: Publication de la release
        if: steps.v.outputs.publish == 'true'
        run: |
          node scripts/release-notes.js "${{ steps.v.outputs.version }}" > release-notes.md
          gh release create "${{ steps.v.outputs.version }}" ./*.vsix \
            --target "${GITHUB_SHA}" \
            --title "Real Pixel Agent ${{ steps.v.outputs.version }}" \
            --notes-file release-notes.md
